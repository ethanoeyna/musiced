name: Build release artifacts

# Fires when a v* tag is pushed (e.g. v0.3.1). Builds Musiced.app on a Mac
# runner and uploads it to the GitHub release for that tag. The Windows .exe
# is currently built locally and uploaded manually — add a windows job below
# if you want CI to handle that too.

on:
  push:
    tags:
      - 'v*'

# Required to call `gh release upload` from the workflow.
permissions:
  contents: write

jobs:
  macos:
    # macos-latest currently = arm64 (Apple Silicon). Intel Macs won't run
    # this binary — if you need x86_64 support, add a second job pinned to
    # macos-13 or build target_arch='universal2' (needs universal Python).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # uv handles Python install per .python-version. Single source of truth.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python from .python-version
        run: uv python install

      # The repo only commits Windows ffmpeg binaries (bin/*.exe). Mac builds
      # need the Mac versions — grab them via Homebrew, which is preinstalled
      # on GitHub macOS runners, then copy into ./bin/ so the spec's _ffmpeg /
      # _ffprobe paths resolve.
      - name: Install ffmpeg + ffprobe (macOS)
        run: |
          brew install ffmpeg
          mkdir -p bin
          cp "$(brew --prefix)/bin/ffmpeg"  bin/ffmpeg
          cp "$(brew --prefix)/bin/ffprobe" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Install Python deps (incl. PyInstaller)
        run: uv sync --group dev

      - name: Build Musiced.app
        run: uv run pyinstaller --clean --noconfirm musiced.spec

      # PyInstaller produces dist/Musiced.app (a directory). Zip it preserving
      # executable bits + symlinks so the .app stays runnable on download.
      - name: Zip the .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Musiced.app Musiced-macos-arm64.zip
          ls -la

      # Upload to the release for this tag. --clobber overwrites if a prior
      # run already attached an asset with the same name (lets you re-run
      # the workflow without manually deleting old assets first).
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # If the release doesn't exist yet (tag was pushed without one),
          # create it. Otherwise just upload the asset.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Musiced $TAG" --notes ""
          fi
          gh release upload "$TAG" dist/Musiced-macos-arm64.zip --clobber
